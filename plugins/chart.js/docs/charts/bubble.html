với bộ phận hỗ trợ." /><ID45088 text="Đã hủy sửa chữa." /><ID45090 text="Nếu vẫn gặp sự cố, bạn có thể lưu nhật ký và liên hệ với bộ phận hỗ trợ." /><ID45084 text="Đã hoàn tất sửa chữa." /><ID45092 text="Sửa chữa MSI không thành công. Vui lòng sử dụng tùy chọn lưu nhật ký và liên hệ với bộ phận hỗ trợ." /><ID45094 text="Citrix Workspace, Horizon hoặc Windows Remote Desktop Client đang chạy. Vui lòng thoát khỏi mọi kết nối trước khi bắt đầu sửa chữa." /><ID45091 text="Không thể bắt đầu sửa chữa MSI. Vui lòng sử dụng tùy chọn lưu nhật ký và liên hệ với bộ phận hỗ trợ." /><ID45087 text="Không thể bắt đầu sửa chữa." /><ID45093 text="Không thể theo dõi quy trình sửa chữa. Bạn có thể tiếp tục chờ hoặc sử dụng tùy chọn lưu nhật ký và liên hệ với bộ phận hỗ trợ." /><ID45085 text="Sửa chữa không thành công." /><ID45086 text="Đã bắt đầu sửa chữa." /><ID45055 text="Tự chẩn đoán là một quy trình bảo trì tự động, cung cấp các giải pháp nhanh chóng cho các sự cố thường gặp và đưa ra tùy chọn sửa chữa." /><ID45054 text="Tự chẩn đoán" /><ID45048 text="Cài đặt cập nhật" /><ID45061 text="Chẩn đoán" /><ID45062 text="Cài đặt" /><ID45081 text="Máy khách HP Anyware chưa được cài đặt." /><ID45082 text="Đã phát hiện sự cố cài đặt Plugin HP Anyware VDI." /><ID45083 text="Plugin HP Anyware VDI không được chọn trong quá trình cài đặt Plugin VDI." /><ID45066 text="Đã bật Chính sách DisableRollBack, phát hiện sự cố cài đặt Plugin Zoom VDI." /><ID45065 text="Đã phát hiện sự cố cài đặt Plugin Zoom VDI." /><ID45064 text="Plugin Zoom VDI chưa được cài đặt." /><ID45018 text="Quản lý plugin VDI" /><ID45070 text="Máy khách Horizon chưa được cài đặt." /><ID45071 text="Đã phát hiện sự cố cài đặt Plugin Horizon VDI." /><ID45072 text="Plugin Horizon VDI không được chọn trong quá trình cài đặt Plugin VDI." /><ID45074 text="Windows Remote Desktop chưa được cài đặt." /><ID45077 text="Đã phát hiện Windows Remote Desktop từ AppStore và chưa được hỗ trợ." /><ID45075 text="Đã phát hiện sự cố cài đặt Plugin Windows Remote Desktop VDI." /><ID45076 text="Plugin Windows Remote Desktop VDI không được chọn trong quá trình cài đặt Plugin VDI." /><ID25274 text="Người chủ trì cuộc họp đã bật bản dịch cho nhiều ngôn ngữ hơn phiên bản Plugin VDI của bạn hỗ trợ. Cần cập nhật lên phiên bản Plugin VDI mới hơn để hiển thị các ngôn ngữ bổ sung." /><ID45014 text="Proxy plugin VDI" /><ID45011 text="Trạng thái plugin VDI" /><ID24542 text="Phiên bản Plugin VDI" /><ID13792 text="Phiên bản Zoom plugin của bạn lớn hơn so với Zoom VDI client đã cài đặt (%s). Plugin của bạn phải bằng hoặc nhỏ hơn (%s) để sử dụng bản phát hành Zoom VDI Client này." /><ID45138 text="&#13;&#10;Plugin Zoom dành cho Azure Virtual Desktop" /><ID45139 text="&#13;&#10;Plugin Zoom dành cho Citrix" /><ID45141 text="&#13;&#10;&#13;&#10;Lưu ý: Trình cài đặt này sẽ ghi đè lên các plugin Zoom đã cài đặt trước đó bên dưới:&#13;&#10;%s" /><ID45140 text="&#13;&#10;Plugin Zoom dành cho VMware" /><ID45157 text="Xóa %s" /><ID45161 text="Đang xóa %s" /><ID45156 text="Sửa %s" /><ID45145 text="Dung lượng đĩa cần thiết vượt quá dung lượng đĩa trống. Các mục đánh dấu cho biết các ổ đĩa không đủ dung lượng đĩa." /><ID45127 text="Plugin VDI HP Anyware: " /><ID45125 text="Plugin VDI AVD: " /><ID45126 text="Plugin VDI AWS: " /><ID45123 text="Plugin VDI Citrix: " /><ID45128 text="Thành công" /><ID45124 text="Plugin Horizon VDI:" /><ID45163 text="Trình cài đặt sẽ tiếp tục cài đặt %s trên máy tính.&#13;&#10;&#13;&#10;Nhấp vào “Hoàn thành” để tiếp tục." /><ID15786 text="Chụp ảnh màn hình" /><ID45111 text="Vui lòng chọn lựa chọn cài đặt của bạn" /><ID45155 text="Chọn xem bạn muốn sửa hay xóa %s." /><ID45110 text="Chọn loại cài đặt" /><ID45013 text="Chế độ chia sẻ VDI" /><ID13784 text="Đã kết nối" /><ID45042 text="Đang kết nối" /><ID45043 text="Không được kết nối" /><ID45177 text="Kết nối với Zoom VDI Plugin" /><ID45178 text="Không được tối ưu hóa, không có kết nối với Zoom VDI Plugin. Truy cập hỗ trợ Zoom để khắc phục sự cố kết nối VDI Plugin" /><ID45176 text="Đã tối ưu hóa thông qua Zoom VDI Plugin" /><ID45152 text="Đã cài đặt thành công %s.&#13;&#10;&#13;&#10;Nhấp vào “Đóng” để thoát." /><ID45153 text="Đã xóa thành công %s.&#13;&#10;&#13;&#10;Nhấp vào “Đóng” để thoát." /><ID45017 text="Phiên bản OS Thin client" /><ID2474 text="ID theo dõi: %s&#10;" /><ID45174 text="Không thể cài đặt vì đã cài đặt phiên bản mới hơn của sản phẩm này" /><ID45134 text="Vui lòng gỡ cài đặt Plugin Zoom VDI Universal (64 bit) trước." /><ID45104 text="Plugin Zoom VDI Universal" /><ID45175 text="Plugin Zoom VDI Universal (ARM64)" /><ID45105 text="Plugin Zoom VDI Universal (64bit)" /><ID13785 text="Phiên bản Zoom plugin không giống với Zoom VDI client. &#10;&#10;Vui lòng cài đặt cùng phiên bản của ứng dụng và plugin để có trải nghiệm tốt nhất.&#10;&#10; Hiện đã cài đặt phiên bản ứng dụng: %s, phiên bản plugin: %s" /><ID13783 text="Kết nối này không cho phép nền ảo, vui lòng kiểm tra cài đặt camera và khởi động lại video." /><ID45170 text="CẢNH BÁO: Chương trình máy tính này được bảo vệ theo luật bản quyền và hiệp ước quốc tế. Việc sao chép hoặc phân phối trái phép chương trình này hoặc bất kỳ phần nào của chương trình có thể dẫn đến các hình phạt dân sự hoặc hình sự nghiêm trọng và sẽ bị truy tố ở mức tối đa có thể theo luật." /><ID45169 text="Chào mừng đến với Trình hướng dẫn thiết lập %s" /><ID45109 text="Plugin Zoom dành cho AVD" /><ID45107 text="Plugin Zoom dành cho Citrix" /><ID45108 text="Plugin Zoom dành cho VMware" /><ID12957 text="Chất lượng âm thanh" /><ID12959 text="Cuộc gọi" /><ID2234 text="Hủy" /><ID12973 text="Chọn sản phẩm" /><ID12963 text="Sản phẩm" /><ID12961 text="Gọi đến" /><ID12967 text="Nhập ID" /><ID12954 text="Không thể gửi. Thử lại" /><ID2235 text="Cuộc họp" /><ID2236 text="Hội thảo trực tuyến" /><ID12972 text="Chuyển tệp" /><ID23584 text="Bạn gặp phải sự cố?" /><ID12966 text="Tôi có một phiếu yêu cầu hỗ trợ đang mở" /><ID12965 text="Bao gồm tệp nhật ký" /><ID12955 text="Đạt tối đa 500 ký tự" /><ID12953 text="Thời gian diễn ra" /><ID12960 text="Khác" /><ID12969 text="{f 2}Bằng cách gửi báo cáo này, bạn ủy quyền cho Zoom truy cập tất cả dữ liệu trong báo cáo này, tuân theo {a %s}Tuyên bố về quyền riêng tư{/a} của Zoom.{/f}" /><ID12970 text="Khi gửi báo cáo này, bạn cho phép Zoom truy cập vào toàn bộ dữ liệu trong báo cáo, tuân theo Tuyên bố về quyền riêng tư của Zoom." /><ID12962 text="Không thể tham gia cuộc họp" /><ID12958 text="Đăng ký" /><ID12974 text="Chọn loại sự cố" /><ID12956 text="Chọn một vấn đề" /><ID2233 text="Gửi" /><ID23585 text="Gửi báo cáo" /><ID12968 text="Mô tả (bắt buộc)" /><ID12952 text="Báo cáo sự cố" /><ID12964 text="Vấn đề" /><ID12971 text="Chất lượng video" /><ID13341 text="Video" /><ID13576 text="Để xác minh, vui lòng xác nhận ngày sinh của bạn. (Dữ liệu này sẽ không được lưu trữ)" /><ID22270 text="Phiên bản" /><ID48425 text="Lời chào thư video" /><ID16972 text="Video" /><ID24075 text="Video của %1" /><ID25073 text="Điều khiển cuộc họp bằng tính năng chia sẻ màn hình" /><ID22605 text="HD" /><ID48401 text="Video &amp; hiệu ứng" /><ID23167 text="Nền ảo" /><ID23016 text="Chọn một camera" /><ID24367 text="{f 2}Quản trị viên của bạn yêu cầu bạn sử dụng nền ảo, nhưng thiết bị của bạn không hỗ trợ tính năng này. {a}{c #4F9AF7}Tìm hiểu thêm{/c}{/a}{/f}" /><ID24366 text="Không thể bắt đầu video của bạn" /><ID14735 text="Không thể phát video này vì không thể chuyển mã video hoặc bộ nhớ máy tính không đủ" /><ID26537 text="DirectShow" /><ID26538 text="Media Foundation" /><ID26506 text="Kết nối video không thành công" /><ID43313 text="Thiết bị video của bạn bị ngắt kết nối" /><ID43284 text="Hiệu ứng và làm đẹp" /><ID25866 text="Đã xảy ra lỗi không xác định, hãy thử lại." /><ID25863 text="Hãy đảm bảo toàn bộ khuôn mặt của bạn xuất hiện trước camera." /><ID23832 text="Bộ lọc video" /><ID23133 text="Tỷ lệ gốc" /><ID24523 text="Bạn có chắc muốn xóa lời chào video không?" /><ID24522 text="Xóa lời chào video" /><ID26690 text="Chỉ người gọi nội bộ mới thấy lời chào video này." /><ID26685 text="Lời chào thư video" /><ID26686 text="Phát lời chào video cho người gọi nội bộ." /><ID24628 text="Xác thực %1 cho mã hóa đầu cuối" /><ID24629 text="Đang tải hồ sơ đã xác minh..." /><ID24635 text="Xác thực" /><ID24632 text="Không thể xác thực" /><ID24633 text="Nhấn %s để thử lại" /><ID24634 text="Xác thực thành công" /><ID24630 text="Xác thực để hiển thị huy hiệu xác minh bằng %s của bạn" /><ID24631 text="Nhấn %s để mở trình duyệt mặc định và xác thực" /><ID24644 text="Di chuột để xem thông tin hồ sơ đã xác thực" /><ID24643 text="Đã xác thực cho mã hóa đầu cuối" /><ID23194 text="Bố cục video" /><ID25864 text="Hãy đảm bảo bạn đang nhìn thẳng vào camera." /><ID26687 text="Quản lý chủ đề" /><ID25865 text="Hãy đảm bảo thể hiện biểu cảm trung lập khi chụp ảnh." /><ID24819 text="Đang tham gia @1..." /><ID24820 text="Quay lại sân khấu chính..." /><ID24939 text="Chuyển từ @1 sang @2..." /><ID24949 text="Chỉ định người dự thính" /><ID24950 text="Để người dự thính chọn phòng" /><ID24944 text="Bao gồm những ai?" /><ID24945 text="Người tham gia chính &amp; người dự thính" /><ID24946 text="Chỉ người tham gia chính" /><ID24947 text="Chỉ định người tham gia chính" /><ID24948 text="Để người tham gia chính chọn phòng" /><ID24943 text="Phòng theo nhóm" /><ID24954 text="Chọn phòng để tham gia" /><ID24953 text="Người chủ trì đang mời bạn chọn phòng theo nhóm để tham gia. Sau khi bạn tham gia vào một phòng, tên của bạn sẽ hiển thị với những người khác, đồng thời bạn cũng có thể sử dụng âm thanh và video khi ở trong phòng này." /><ID24941 text="Sau khi bạn tham gia vào một phòng, tên của bạn sẽ hiển thị với những người khác, đồng thời bạn cũng có thể sử dụng âm thanh và video khi ở trong phòng này." /><ID24942 text="Người chủ trì đang mời bạn @1." /><ID24940 text="Người tham gia chính" /><ID23400 text="Video bây giờ được bắt đầu" /><ID23401 text="Video bây giờ được dừng" /><ID43357 text="Camera đã chọn không khả dụng" /><ID43356 text="Vui lòng thay đổi sang camera khác, sau đó chọn “tiếp tục”  để tiếp tục ghi." /><ID43355 text="Đã tạm dừng ghi clip vì camera không khả dụng" /><ID26303 text="Bảng video bị ẩn" /><ID26304 text="Bảng video được hiển thị" /><ID22689 text="Xem trước video" /><ID25946 text="Gửi kèm hiệu ứng" /><ID25948 text="Bong bóng" /><ID25947 text="Hiệu ứng này yêu cầu bạn phải bật camera." /><ID25949 text="Tên lửa" /><ID48432 text="Nhận dạng video" /><ID48433 text="Tải lên hình ảnh của bạn để sử dụng cho các tính năng nhận dạng video thông minh trong dịch vụ Zoom." /><ID23168 text="Chọn hình nền" /><ID23169 text="Chọn video nền" /><ID23134 text="Xoay 90°" /><ID24079 text="Video và chia sẻ màn hình của %1" /><ID23589 text="Bao gồm ảnh chụp màn hình máy tính" /><ID23591 text="Đã rời đi/Đã loại bỏ" /><ID23590 text="{f 7}{c g_secondary_text_color}Khi gửi báo cáo này, bạn cho phép Zoom truy cập tất cả dữ liệu trong báo cáo, tuân thủ theo {a}Tuyên bố về quyền riêng tư{/a} của Zoom. Dữ liệu này bao gồm ảnh chụp màn hình, thông tin người dùng của bạn, thông tin người dùng của người mà bạn báo cáo và tất cả thông tin liên quan đến cuộc họp.{/c}{/f}" /><ID23588 text="Đội ngũ Tin cậy &amp; An toàn của chúng tôi sẽ gửi email cho bạn sau cuộc họp để tìm hiểu thêm về sự cố." /><ID23587 text="Cảm ơn bạn đã báo cáo" /><ID23586 text="Bạn muốn báo cáo ai?" /><ID26075 text="Cài đặt này đã chuyển sang {a}{f 2}Nền &amp; hiệu ứng{/a}{/f}" /><ID22606 text="Hiển thị tôi như một diễn giả đang hoạt động khi tôi nói chuyện" /><ID24372 text="Video của bạn bị dừng vì quản trị viên của bạn yêu cầu bạn sử dụng nền ảo" /><ID26967 text="Video" /><ID23170 text="Thêm hình ảnh hoặc video" /><ID23171 text="Thêm hình ảnh" /><ID23172 text="Thêm video" /><ID23174 text="Chọn màu" /><ID2450 text="Chọn thủ công màu nền nếu màu được phát hiện không chính xác." /><ID23173 text="Công nghệ của Zoom tự động phát hiện màu nền video của bạn và thay thế bằng ảnh nền ảo. Nếu màu được phát hiện không chính xác, bạn có thể chọn thủ công màu từ nền video của bạn." /><ID23166 text="Bắt buộc để nền video màu đơn sắc. Ưu tiên màu xanh lục." /><ID2452 text="Sử dụng màn hình xanh lục có thể cải thiện chất lượng nền ảo." /><ID2525 text="Tiếng Việt (Việt Nam)" /><ID26207 text="Đang xem %1" /><ID23894 text="Xem" /><ID23909 text="Bạn không thể di chuyển video vì bạn đang theo thứ tự video của người chủ trì" /><ID23907 text="Bạn không thể di chuyển video trong khi mọi người bị ghim" /><ID23908 text="Bạn không thể di chuyển video trong khi mọi người đang được làm nổi bật" /><ID23910 text="Bạn không thể di chuyển video trong khi ai đó đã giơ tay" /><ID14338 text="Xem chứng nhận" /><ID14068 text="Xem tất cả cuộc trò chuyện &amp; kênh %d" /><ID23915 text="Đừng hỏi lại tôi nữa" /><ID15099 text="Xem/chỉnh sửa nhóm được nhắc đến" /><ID48435 text="Xem hình ảnh đã đăng ký" /><ID23904 text="Theo thứ tự video của người chủ trì" /><ID23896 text="Thư viện" /><ID26395 text="Xem thông tin cuộc họp" /><ID26397 text="Cuộc họp này có tệp đính kèm" /><ID15100 text="Xem nhóm được nhắc đến" /><ID25160 text="Xem tin nhắn" /><ID23996 text="Xem gói đăng ký của tôi" /><ID23906 text="Kéo và thả để sắp xếp lại video" /><ID23808 text="Xem những người có thể bật tiếng bạn" /><ID23913 text="Xóa tất cả video nổi bật" /><ID23914 text="Ghim %1 sẽ xóa tất cả các video nổi bật cho mọi người. Bạn có muốn tiếp tục?" /><ID25099 text="Xem" /><ID23902 text="Xóa tất cả ghim" /><ID23903 text="Xóa tất cả tiêu điểm" /><ID23905 text="Đặt lại thứ tự video" /><ID24028 text="Xem ảnh chụp màn hình" /><ID26166 text="Xem cài đặt" /><ID26357 text="Chỉ nội dung được chia sẻ" /><ID23899 text="Cạnh nhau: thư viện" /><ID23900 text="Cạnh nhau: Nhiều diễn giả" /><ID23898 text="Cạnh nhau: người nói" /><ID23895 text="Người nói" /><ID23911 text="Xóa tất cả video đã ghim" /><ID23912 text="Làm nổi bật %1 cho mọi người sẽ xóa tất cả video đã ghim. Bạn có muốn tiếp tục?" /><ID26393 text="Xem thẻ nổi bật" /><ID23897 text="Tiêu chuẩn" /><ID23901 text="
