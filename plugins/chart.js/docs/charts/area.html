 thử lại." /><ID22313 text="Vui lòng nói vào micrô của bạn." /><ID22316 text="Dường như có vấn đề với loa của bạn, vui lòng chọn một thiết bị khác và thử lại." /><ID43456 text="Mức độ đầu vào" /><ID43452 text="Nói và tạm dừng. Nếu bạn hài lòng với chất lượng giọng nói, hãy tiếp tục ghi clip." /><ID43453 text="Nói và tạm dừng. Nếu bạn có thể nghe thấy âm thanh và hài lòng với chất lượng giọng nói, hãy tiếp tục ghi clip." /><ID43454 text="Nói và tạm dừng. Nếu bạn hài lòng với chất lượng giọng nói, bạn có thể bắt đầu tạo lại ảnh đại diện của mình." /><ID43455 text="Chọn micrô" /><ID24416 text="Kiểm tra thiết bị Zoom" /><ID43451 text="Kiểm tra micrô" /><ID48224 text="Kiểm tra micrô" /><ID24427 text="{f 1}{a}{c g_link_text_color}Kiểm tra loa và micrô{/c}{/a}{/f}" /><ID26625 text="Kiểm tra loa và Mic" /><ID48223 text="Kiểm tra loa" /><ID24184 text="Đang kiểm tra @1/@2" /><ID24185 text="Đã kiểm tra @1/@2" /><ID2131 text=" và tất cả người tham gia chính" /><ID22622 text="{f 1}{a}Sao chép liên kết{/a}{/f}" /><ID22181 text="Mã thông báo API được sao chép vào clipboard" /><ID22180 text="Sao chép mã thông báo này và dán vào công cụ phụ đề rời của bên thứ ba" /><ID16249 text="Sao chép liên kết vào huddle" /><ID16250 text="Sao chép liên kết huddle" /><ID25537 text="Từ chối tất cả yêu cầu cho cuộc họp này" /><ID13007 text="{f 1}Để tạo một đoạn mã, {a}tải xuống gói đoạn mã.{/a}{/f}" /><ID16252 text="Không thông báo cho tôi khi huddle đang hoạt động" /><ID25526 text="Không thể gửi yêu cầu vì người chủ trì đang ghi lại bản ghi trên đám mây." /><ID25525 text="Không thể gửi yêu cầu vì người chủ trì đang ghi." /><ID25524 text="Không thể gửi yêu cầu khi người chủ trì và bạn đang ở trong các tình huống khác nhau (ví dụ: phòng theo nhóm khác nhau)." /><ID25527 text="Không thể gửi yêu cầu vì người chủ trì sử dụng ứng dụng Zoom Workplace đã lỗi thời, không có mặt trong cuộc họp, hoặc vì các lý do khác." /><ID25523 text="Bạn không thể gửi yêu cầu ghi lại trên đám mây do cài đặt của người chủ trì." /><ID16248 text="Huddle" /><ID16595 text="%d người đã tham gia" /><ID16246 text="Tham gia huddle" /><ID16247 text="Rời khỏi huddle" /><ID16251 text="Thông báo cho tôi khi huddle đang hoạt động" /><ID17069 text="{f 2}{c g_text_text_stronger_neutral_color}Hoặc sử dụng {a}mã xác thực dùng một lần{/a} được gửi đến email của bạn để không phải nhập mật khẩu.{/c}{/f}" /><ID12739 text="hoặc" /><ID12741 text="%1 cũ hơn %2 ngày đã bị xóa" /><ID12743 text="%1 cũ hơn %2 tháng đã bị xóa" /><ID12740 text="%s cũ hơn 24 giờ đã bị xóa" /><ID12742 text="%s cũ hơn 1 tháng đã bị xóa" /><ID12744 text="%s cũ hơn 1 năm đã bị xóa" /><ID12745 text="%1 cũ hơn %2 năm đã bị xóa" /><ID2216 text="Tệp" /><ID2217 text="Hình ảnh" /><ID12746 text="Tin nhắn" /><ID13741 text="{f 1}Sau khi lên lịch cuộc họp này, các cài đặt bạn thay đổi tại đây sẽ áp dụng cho tất cả các cuộc họp được lên lịch với ID cuộc họp cá nhân. {a}{c g_link_text_color}Trở lại cài đặt{/c}{/a}{/f}" /><ID25292 text="Khi bạn đến hậu trường, chúng tôi sẽ dừng cảnh hiện tại. Và người khác chỉ nhìn thấy hoặc nghe thấy bạn ở hậu trường." /><ID25518 text="Không thể bật ghi lại thông minh bằng AI Companion và bắt đầu ghi. Vui lòng thử lại sau." /><ID25508 text="Đã bật ghi lại thông minh bằng AI Companion" /><ID25522 text="Tính năng này sẽ chỉ có hiệu lực cho các cuộc họp tiếp theo." /><ID26709 text="Văn bản thành giọng nói" /><ID25520 text="Bạn có thể bật ghi lại thông minh bằng AI Companion trong %1. Sau khi bật ghi lại thông minh bằng AI Companion, tính năng ghi lại trên đám mây của bạn sẽ tạo nội dung nổi bật trong bản ghi, bản tóm tắt và chương thông minh cũng như các bước tiếp theo." /><ID22217 text="Tiếng Thái" /><ID15720 text="Cảm ơn bạn đã sử dụng Zoom" /><ID26005 text="Chủ đề màu không khả dụng khi người chủ trì đã đặt hình nền cuộc họp" /><ID24645 text="Chủ đề" /><ID25898 text="Chỉ áp dụng khi hệ thống đang sử dụng chế độ sáng" /><ID25899 text="Chủ đề màu khả dụng khi ứng dụng được đặt thành chế độ sáng hoặc cài đặt hệ thống đang ở chế độ sáng.&#13;&#10;&#13;&#10;Chủ đề “Cổ điển” áp dụng màu xám cho thanh công cụ điều hướng ứng dụng và đặt cửa sổ cuộc họp và hội thảo trực tuyến thành màu xám đậm.&#13;&#10;&#13;&#10;Màu xám đậm được tự động áp dụng cho các cuộc họp và hội thảo trực tuyến sử dụng hình nền tùy chỉnh." /><ID26415 text="Đồng chủ trì" /><ID26414 text="Người chủ trì" /><ID24621 text="Người chủ trì đã bắt đầu hội thảo trực tuyến này" /><ID26416 text="Cuộc họp" /><ID24552 text="Cuộc họp không hỗ trợ chia sẻ màn hình" /><ID26417 text="Hội thảo trực tuyến" /><ID24553 text="hội thảo trực tuyến không hỗ trợ chia sẻ màn hình" /><ID26515 text="Âm thanh của bên thứ ba" /><ID26510 text="Hướng dẫn kết nối âm thanh sẽ được trình bày trong cuộc họp" /><ID24622 text="Đây là hội thảo trực tuyến định kỳ" /><ID26938 text="Hội thảo trực tuyến mô phỏng trực tiếp này sẽ bắt đầu lúc @1" /><ID26939 text="Hội thảo trực tuyến mô phỏng trực tiếp này sẽ bắt đầu vào @1 lúc @2" /><ID26936 text="Hội thảo trực tuyến này sẽ bắt đầu vào @1" /><ID26937 text="Hội thảo trực tuyến này sẽ bắt đầu vào @1 lúc @2" /><ID13588 text="Thời gian kết thúc " /><ID13276 text="không sẵn sàng" /><ID24957 text="Thời gian còn lại" /><ID24275 text="Đã chấp nhận" /><ID12581 text="Lưu biểu tượng cảm xúc từ cuộc trò chuyện bất kỳ" /><ID12582 text="Nhấn chuột phải vào hình ảnh bất kỳ trong cửa sổ trò chuyện,&#13;&#10;sau đó chọn &quot;%s&quot;" /><ID12583 text="Tải lên nhãn dán của riêng bạn" /><ID12584 text="Nhấp vào menu ở góc dưới bên phải" /><ID13154 text="Kết nối lịch làm việc hoặc lịch cá nhân của bạn để xem tất cả các cuộc họp sắp tới tại đây" /><ID23388 text="Nhấn ALT để hiển thị hoặc ẩn điều khiển cuộc họp" /><ID24227 text="{b}%v{/b} của cuộc họp này đang được tổ chức của một hoặc nhiều người tham gia lưu trữ dựa trên chính sách tài khoản của họ. {a %A #ffffff #ffffff u}Chủ tài khoản{/a} của họ sẽ nhận được nội dung từ cuộc họp này và có thể chia sẻ nội dung đó với các ứng dụng và những người khác." /><ID2
